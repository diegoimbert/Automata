description: Okta API token (SSWS) plus org base URL, authorizing the Okta
  Management API for users, groups and apps.
format_extension: null
is_fileset: false
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    org_url:
      type: string
      description: Your Okta org base URL, without a trailing slash, e.g.
        https://dev-123456.okta.com or https://acme.okta.com. All API calls are
        made against this host under /api/v1.
    token:
      type: string
      description: Okta API token (SSWS). Create one in the Admin Console under
        Security > API > Tokens. It inherits the permissions of the admin who
        created it.
  required:
    - org_url
    - token
