description: Zoom Server-to-Server OAuth app credentials (account ID, client ID
  and secret, webhook secret token) for the Zoom API.
format_extension: null
is_fileset: false
schema:
  $schema: http://json-schema.org/draft-04/schema#
  type: object
  properties:
    accountId:
      type: string
    oauthClientId:
      type: string
    oauthClientSecret:
      type: string
    webhookSecretToken:
      type: string
  required:
    - accountId
    - oauthClientId
    - oauthClientSecret
