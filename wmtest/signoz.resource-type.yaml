description: Credentials for the SigNoz API using an API key, with the base URL
  of the SigNoz instance (Cloud or self-hosted).
format_extension: null
is_fileset: false
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    apiKey:
      type: string
      description: API key retrieved from the dashboard.
    baseUrl:
      type: string
      description: Base URL for the Signoz API - signoz.io for Cloud Hosted version.
  required:
    - apiKey
    - baseUrl
