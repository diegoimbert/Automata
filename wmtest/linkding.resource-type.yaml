description: >-
  Base URL and API token for a self-hosted Linkding bookmark manager instance's
  REST API.


  See the Linkding README for setup and where to find the API token:
  https://github.com/sissbruecker/linkding/blob/master/README.md
format_extension: null
is_fileset: false
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    baseUrl:
      type: string
      description: The baseUrl of the instance
      default: ''
    token:
      type: string
      description: API token to connect to the API
      default: ''
  required:
    - token
