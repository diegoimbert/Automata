description: Client ID, client secret and domain for the OAuth 2.0 client
  credentials flow (machine-to-machine API authentication).
format_extension: null
is_fileset: false
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - domain
    - client_id
    - client_secret
  properties:
    client_id:
      type: string
      description: ''
      default: ''
      nullable: false
    client_secret:
      type: string
      description: ''
      default: ''
      nullable: false
    domain:
      type: string
      description: For example, "<tenant>.us.auth0.com"
      default: ''
      nullable: false
  required:
    - domain
    - client_id
    - client_secret
