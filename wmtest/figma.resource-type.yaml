description: Credentials for the Figma REST API using a personal access token or
  OAuth access token.
format_extension: null
is_fileset: false
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    token:
      type: string
      description: Follow the OAuth flow described at
        https://www.figma.com/developers/api#authentication
  required:
    - token
